<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <h1 class="title">Math App</h1>

    <div class="display">
      <div class="expression" id="expression" aria-hidden="true"></div>
      <output class="entry" id="entry" aria-live="polite" aria-label="Result">0</output>
    </div>

    <div class="keypad">
      <button type="button" class="key key--action" data-action="clear">AC</button>
      <button type="button" class="key key--action" data-action="backspace" aria-label="Backspace">&#9003;</button>
      <button type="button" class="key key--action" data-action="percent">%</button>
      <button type="button" class="key key--operator" data-operator="/" aria-label="Divide">&divide;</button>

      <button type="button" class="key" data-digit="7">7</button>
      <button type="button" class="key" data-digit="8">8</button>
      <button type="button" class="key" data-digit="9">9</button>
      <button type="button" class="key key--operator" data-operator="*" aria-label="Multiply">&times;</button>

      <button type="button" class="key" data-digit="4">4</button>
      <button type="button" class="key" data-digit="5">5</button>
      <button type="button" class="key" data-digit="6">6</button>
      <button type="button" class="key key--operator" data-operator="-" aria-label="Subtract">&minus;</button>

      <button type="button" class="key" data-digit="1">1</button>
      <button type="button" class="key" data-digit="2">2</button>
      <button type="button" class="key" data-digit="3">3</button>
      <button type="button" class="key key--operator" data-operator="+" aria-label="Add">+</button>

      <button type="button" class="key key--action" data-action="negate" aria-label="Toggle sign">&plusmn;</button>
      <button type="button" class="key" data-digit="0">0</button>
      <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
      <button type="button" class="key key--equals" data-action="equals" aria-label="Equals">=</button>
    </div>

    <p class="hint">Tip: you can also use your keyboard &mdash; digits, <kbd>+</kbd> <kbd>-</kbd> <kbd>*</kbd> <kbd>/</kbd>, <kbd>Enter</kbd>, <kbd>Esc</kbd>.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
